services:
  mrr:
    build: .
    image: mrr:latest
    container_name: mrr
    restart: unless-stopped
    ports:
      - "${MRR_PORT:-8130}:8130"
    environment:
      # Public URL GitLab will call. Must be reachable from your GitLab instance —
      # localhost works only if GitLab runs on this same machine.
      MRR_BASE_URL: ${MRR_BASE_URL:-http://localhost:8130}
      # Encrypts the per-project credentials at rest. Unset = plaintext, with a boot warning.
      # openssl rand -base64 32
      MRR_SECRET_KEY: ${MRR_SECRET_KEY:-}
      MRR_SECRET_KEY_FILE: ${MRR_SECRET_KEY_FILE:-}
      # Empty = SQLite at /data/mrr.db, which is the default. Set MRR_DB_URL in .env to
      # use an external Postgres instead — see "Database" in the README, and the db
      # service commented out at the bottom of this file for a local one.
      MRR_DB_URL: ${MRR_DB_URL:-}
      MRR_DB_USER: ${MRR_DB_USER:-}
      MRR_DB_PASSWORD: ${MRR_DB_PASSWORD:-}
      MRR_DB_POOL_SIZE: ${MRR_DB_POOL_SIZE:-4}
      MRR_REVIEW_WORKERS: ${MRR_REVIEW_WORKERS:-2}
      MRR_SCAN_INTERVAL_MS: ${MRR_SCAN_INTERVAL_MS:-120000}
      MRR_MAX_DIFF_CHARS: ${MRR_MAX_DIFF_CHARS:-200000}
      MRR_MAX_DIFF_CHUNKS: ${MRR_MAX_DIFF_CHUNKS:-8}
      MRR_REVIEW_TIMEOUT: ${MRR_REVIEW_TIMEOUT:-300}
      MRR_MAX_FILE_CHARS: ${MRR_MAX_FILE_CHARS:-80000}
      MRR_MAX_DOCUMENT_CHARS: ${MRR_MAX_DOCUMENT_CHARS:-20000}
      MRR_MAX_TRACE_CHARS: ${MRR_MAX_TRACE_CHARS:-8000}
      MRR_LIBRARIAN_MAX_TURNS: ${MRR_LIBRARIAN_MAX_TURNS:-6}
      MRR_MAX_MEMORY_CHARS: ${MRR_MAX_MEMORY_CHARS:-8000}
      MRR_MAX_MODEL_TOKENS: ${MRR_MAX_MODEL_TOKENS:-16000}
      MRR_ANTHROPIC_EFFORT: ${MRR_ANTHROPIC_EFFORT:-high}
    volumes:
      # Host dir, not a named volume, so you can scp mrr.db in and swap image tags
      # without losing it. The entrypoint chowns this to uid 10001 on start
      # (Compose often creates ./data as root). Or: mkdir -p data && sudo chown -R 10001:10001 data
      - ${MRR_DATA:-./data}:/data

# Postgres, if you would rather not keep the database on the container's disk. Uncomment
# this service and the volume, add `depends_on: [db]` to mrr above, and set in .env:
#
#   MRR_DB_URL=jdbc:postgresql://db:5432/mrr
#   MRR_DB_USER=mrr
#   MRR_DB_PASSWORD=<the same value as POSTGRES_PASSWORD below>
#   MRR_DB_POOL_SIZE=10
#
# Keep the /data mount either way: the root token and the memory files live there, and the
